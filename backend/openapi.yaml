openapi: 3.0.3
info:
  title: OPD Billing & Patient Booking API
  version: "1.0.0"
  description: >
    Medical billing & patient OPD booking backend.
    Authentication is via AWS Cognito (JWT bearer tokens). Authorization is
    role-based (RBAC) from Cognito groups: super_admin, admin, manager, doctor,
    front_office.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Patients
  - name: Doctors
  - name: Appointments
  - name: Billing
  - name: Reports

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks database)
      security: []
      responses:
        "200": { description: Ready }
        "500": { description: A dependency is unavailable }

  /api/v1/openapi.yaml:
    get:
      tags: [Health]
      summary: This OpenAPI document
      security: []
      responses:
        "200": { description: OpenAPI spec (YAML) }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user in Cognito
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Registered; confirmation code sent }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/auth/confirm:
    post:
      tags: [Auth]
      summary: Confirm a sign-up with the emailed code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmRequest" }
      responses:
        "200": { description: Account confirmed }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/auth/resend-code:
    post:
      tags: [Auth]
      summary: Resend the confirmation code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Code resent }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive Cognito tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for new access/ID tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, username]
              properties:
                refresh_token: { type: string }
                username:
                  type: string
                  description: The user's Cognito sub (from login / /auth/me).
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Global sign-out (revokes all of the user's tokens)
      responses:
        "200": { description: Logged out }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current identity and roles
      responses:
        "200": { description: Identity }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/patients:
    get:
      tags: [Patients]
      summary: List patients
      description: "Requires: PatientRead"
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { description: Paginated patients }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Patients]
      summary: Create a patient
      description: "Requires: PatientWrite"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePatient" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/patients/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Patients]
      summary: Get a patient
      description: "Requires: PatientRead"
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Patients]
      summary: Update a patient
      description: "Requires: PatientWrite"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePatient" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
    delete:
      tags: [Patients]
      summary: Delete a patient
      description: "Requires: PatientDelete"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/patients/{patient_id}/reports:
    parameters:
      - name: patient_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: "#/components/parameters/Limit" }
      - { $ref: "#/components/parameters/Offset" }
    get:
      tags: [Reports]
      summary: List a patient's reports
      description: "Requires: ReportRead"
      responses:
        "200": { description: Paginated reports }

  /api/v1/doctors:
    get:
      tags: [Doctors]
      summary: List doctors
      description: "Requires: DoctorRead"
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { description: Paginated doctors }
    post:
      tags: [Doctors]
      summary: Create a doctor
      description: "Requires: DoctorWrite"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDoctor" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }

  /api/v1/doctors/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Doctors]
      summary: Get a doctor
      description: "Requires: DoctorRead"
      responses:
        "200":
          description: Doctor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }
    delete:
      tags: [Doctors]
      summary: Deactivate a doctor
      description: "Requires: DoctorWrite"
      responses:
        "204": { description: Deactivated }

  /api/v1/appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      description: "Requires: AppointmentRead"
      parameters:
        - { name: patient_id, in: query, schema: { type: string, format: uuid } }
        - { name: doctor_id, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, checked_in, completed, cancelled, no_show]
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { description: Paginated appointments }
    post:
      tags: [Appointments]
      summary: Book an appointment (OPD)
      description: "Requires: AppointmentWrite"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAppointment" }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }

  /api/v1/appointments/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Appointments]
      summary: Get an appointment
      description: "Requires: AppointmentRead"
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
    patch:
      tags: [Appointments]
      summary: Update an appointment
      description: "Requires: AppointmentWrite"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAppointment" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }

  /api/v1/appointments/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Appointments]
      summary: Cancel an appointment
      description: "Requires: AppointmentWrite"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }

  /api/v1/invoices:
    get:
      tags: [Billing]
      summary: List invoices
      description: "Requires: BillingRead"
      parameters:
        - { name: patient_id, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, issued, partially_paid, paid, cancelled]
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { description: Paginated invoices }
    post:
      tags: [Billing]
      summary: Create an invoice
      description: "Requires: BillingWrite. Totals are computed server-side."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoice" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDetail" }

  /api/v1/invoices/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Billing]
      summary: Get an invoice with items and payments
      description: "Requires: BillingRead"
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDetail" }

  /api/v1/invoices/{id}/payments:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Billing]
      summary: Record a payment against an invoice
      description: "Requires: BillingWrite"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePayment" }
      responses:
        "200": { description: Payment recorded; invoice updated }

  /api/v1/reports:
    post:
      tags: [Reports]
      summary: Upload a report file to S3
      description: "Requires: ReportWrite. multipart/form-data."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [patient_id, file]
              properties:
                patient_id: { type: string, format: uuid }
                appointment_id: { type: string, format: uuid }
                report_type: { type: string, example: lab }
                title: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  /api/v1/reports/{id}/download:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Reports]
      summary: Get a presigned S3 download URL
      description: "Requires: ReportRead"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_in_secs: { type: integer }

  /api/v1/reports/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    delete:
      tags: [Reports]
      summary: Delete a report (record + S3 object)
      description: "Requires: ReportDelete"
      responses:
        "204": { description: Deleted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: validation_error }
            message: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, given_name, family_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        given_name: { type: string }
        family_name: { type: string }
        phone_number: { type: string, example: "+919000000000" }

    ConfirmRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string, nullable: true }
        id_token: { type: string, nullable: true }
        refresh_token: { type: string, nullable: true }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }

    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        cognito_sub: { type: string, nullable: true }
        first_name: { type: string }
        last_name: { type: string }
        date_of_birth: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [male, female, other, unknown], nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatePatient:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string, enum: [male, female, other, unknown] }
        phone: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        cognito_sub: { type: string }

    Doctor:
      type: object
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        specialization: { type: string }
        department: { type: string, nullable: true }
        consultation_fee: { type: string, example: "500.00" }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateDoctor:
      type: object
      required: [first_name, last_name, specialization]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        specialization: { type: string }
        department: { type: string }
        consultation_fee: { type: string, example: "500.00" }
        email: { type: string, format: email }
        phone: { type: string }

    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, checked_in, completed, cancelled, no_show] }
        reason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAppointment:
      type: object
      required: [patient_id, doctor_id, scheduled_at]
      properties:
        patient_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time }
        reason: { type: string }
        notes: { type: string }

    UpdateAppointment:
      type: object
      properties:
        doctor_id: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, checked_in, completed, cancelled, no_show] }
        reason: { type: string }
        notes: { type: string }

    InvoiceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: string, example: "1" }
        unit_price: { type: string, example: "500.00" }
        amount: { type: string, example: "500.00" }
        created_at: { type: string, format: date-time }

    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_number: { type: string }
        patient_id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, issued, partially_paid, paid, cancelled] }
        currency: { type: string, example: INR }
        subtotal: { type: string }
        tax: { type: string }
        discount: { type: string }
        total: { type: string }
        amount_paid: { type: string }
        notes: { type: string, nullable: true }
        issued_at: { type: string, format: date-time, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/InvoiceItem" }
            payments:
              type: array
              items: { $ref: "#/components/schemas/Payment" }

    CreateInvoice:
      type: object
      required: [patient_id, items]
      properties:
        patient_id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unit_price]
            properties:
              description: { type: string }
              quantity: { type: string, example: "1" }
              unit_price: { type: string, example: "500.00" }
        tax: { type: string, example: "0" }
        discount: { type: string, example: "0" }
        currency: { type: string, example: INR }
        due_date: { type: string, format: date }
        notes: { type: string }
        issue_now: { type: boolean, default: false }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        amount: { type: string }
        method: { type: string, enum: [cash, card, upi, netbanking, insurance, other] }
        reference: { type: string, nullable: true }
        paid_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    CreatePayment:
      type: object
      required: [amount, method]
      properties:
        amount: { type: string, example: "500.00" }
        method: { type: string, enum: [cash, card, upi, netbanking, insurance, other] }
        reference: { type: string }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid, nullable: true }
        report_type: { type: string }
        title: { type: string }
        s3_bucket: { type: string }
        s3_key: { type: string }
        content_type: { type: string }
        file_size_bytes: { type: integer }
        uploaded_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

security:
  - bearerAuth: []
