[package]
name = "opd-billing-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Medical billing & patient OPD booking backend (AWS Cognito + RDS Postgres + S3)"
license = "MIT"

[dependencies]
# ---- Web framework / async runtime ----
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "request-id", "util"] }

# ---- Serialization ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- Database (AWS RDS Postgres) ----
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "migrate",
    "macros",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# ---- AWS SDK ----
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-s3 = "1"

# ---- Auth (validate Cognito JWTs via JWKS) ----
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# ---- Errors / logging / config ----
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
validator = { version = "0.19", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
